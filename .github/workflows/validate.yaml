name: Validate

# 기여는 대부분 YAML 한 장이므로 이 잡이 실질적인 게이트다.
# 외부 네트워크에 의존하지 않아 빠르고, 일시적 장애로 PR 이 막히지 않는다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: DAG 검증
        run: npm run validate

      # 번역 상태 없이도 빌드가 깨지지 않는지 확인한다.
      # (l10n.json 은 생성물이라 저장소에 없다 — build.ts 는 unknown 으로 degrade 한다)
      - name: 빌드 확인
        run: npx tsx scripts/build.ts
